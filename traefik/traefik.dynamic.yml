tcp:
  routers:
    neo4j-bolt:
      rule: "HostSNI(`${NEO4J_HOSTNAME}`)"
      entryPoints:
        - "bolt"
      service: "neo4j-bolt-svc"
      tls:
        passthrough: true
  services:
    neo4j-bolt-svc:
      loadBalancer:
        servers:
          -
            address: "neo4j:7687"
